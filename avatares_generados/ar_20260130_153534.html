    <style>
        body {

            overflow: hidden;
            font-family: Arial, sans-serif;

        #landing {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;

            align-items: center;
            z-index: 10000;

            text-align: center;

            margin-bottom: 15px;
        }

            margin-bottom: 25px;
            max-width: 85%;
            line-height: 1.5;
        }
        
        #startAR {
            background: white;
            color: #667eea;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        #arScene {
            display: none;
        }
        
        #controls {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.75);
            padding: 12px 18px;
            border-radius: 25px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }
        
        .btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        
        #info {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(33, 150, 243, 0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 18px;
            text-align: center;
            max-width: 85%;
            font-size: 13px;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            font-size: 11px;
        }
        
        input[type="range"] {
            width: 70px;
        }
    </style>
</head>

    <script>
        let avatar = null;
        let currentScale = 1.5;
        let currentRotationY = 0;
        let isPlaced = false;

        document.getElementById('startAR').addEventListener('click', function() {
            document.getElementById('landing').style.display = 'none';
            document.getElementById('arScene').style.display = 'block';
            
            setTimeout(() => {
                avatar = document.querySelector('#avatar');
            }, 500);
        });

        document.getElementById('placeBtn').addEventListener('click', function() {
            if (!avatar) return;
            
            let camera = document.querySelector('a-camera');
            let cameraPos = camera.getAttribute('position');
            let cameraRot = camera.getAttribute('rotation');
            
            let distance = 1.8;
            let radians = (cameraRot.y * Math.PI) / 180;
            
            let newX = cameraPos.x - Math.sin(radians) * distance;
            let newZ = cameraPos.z - Math.cos(radians) * distance;
            
            avatar.setAttribute('position', {
                x: newX,
                y: 0,
                z: newZ
            });
            
            avatar.setAttribute('rotation', {
                x: 0,
                y: cameraRot.y + 180,
                z: 0
            });
            
            currentRotationY = cameraRot.y + 180;
            isPlaced = true;
            
            this.textContent = '✓ Colocado';
            setTimeout(() => {
                this.textContent = '📍 Colocar';
            }, 1500);
        });

        document.getElementById('scaleSlider').addEventListener('input', function() {
            if (!avatar) return;
            currentScale = parseFloat(this.value);
            document.getElementById('scaleValue').textContent = currentScale.toFixed(1) + 'x';
            avatar.setAttribute('scale', {
                x: currentScale,
                y: currentScale,
                z: currentScale
            });
        });

        document.getElementById('rotateBtn').addEventListener('click', function() {
            if (!avatar) return;
            currentRotationY += 45;
            avatar.setAttribute('rotation', {
                x: 0,
                y: currentRotationY,
                z: 0
            });
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            if (!avatar) return;
            avatar.setAttribute('position', '0 0 -2.5');
            avatar.setAttribute('rotation', '0 0 0');
            currentScale = 1.5;
            currentRotationY = 0;
            document.getElementById('scaleSlider').value = 1.5;
            document.getElementById('scaleValue').textContent = '1.5x';
            avatar.setAttribute('scale', '1.5 1.5 1.5');
            isPlaced = false;
        });

        setTimeout(() => {
            let scene = document.querySelector('a-scene');
            if (scene) {
                scene.addEventListener('click', function() {
                    if (!isPlaced) {
                        document.getElementById('placeBtn').click();
                    }
                });
            }
        }, 1000);
    </script>
</body>
</html>
