
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: white; height: 100vh; display: flex; flex-direction: column; }
        .header { background: rgba(0,0,0,0.8); padding: 15px; text-align: center; border-bottom: 2px solid #4CAF50; }
        model-viewer { width: 100%; height: 100%; background-color: #1a1a1a; }
        .ar-button { background: #4CAF50; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; }
    </style>
</head>
<body>
    <div class="header"><h1>Probador Virtual AR</h1><p>Escanea y proyecta el modelo en tu espacio</p></div>
    <model-viewer src="http://127.0.0.1:5000/model/avatar_193003.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1" auto-rotate>
        <button slot="ar-button" class="ar-button">VER EN MI ESPACIO</button>
    </model-viewer>
</body>
</html>
